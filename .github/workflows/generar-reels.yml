name: Generar reels Guineo Comunicaciones

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lotes/actual.json"
      - "lotes/audio/**"
      - "scripts/guineo/**"
      - ".github/workflows/generar-reels.yml"

permissions:
  contents: write

concurrency:
  group: generar-reels
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Generar videos
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: uv run python scripts/guineo/generar.py lotes/actual.json salida

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reels
          path: salida/*.mp4
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar videos en un Release (enlaces publicos para Metricool)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(salida/*.mp4)
          if [ ${#files[@]} -eq 0 ]; then echo "Sin videos"; exit 0; fi
          tag="reels-$(date -u +%Y%m%d-%H%M)-${{ github.run_number }}"
          gh release create "$tag" "${files[@]}" --title "Reels Guineo $tag" --notes "Generado por la ejecucion ${{ github.run_id }}" --target "${{ github.sha }}"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
