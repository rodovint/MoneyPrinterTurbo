name: Generar reels Guineo Deportes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lotes/actual.json"
      - "scripts/guineo/**"
      - ".github/workflows/generar-reels.yml"

permissions:
  contents: read

concurrency:
  group: generar-reels
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Generar videos
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: uv run python scripts/guineo/generar.py lotes/actual.json salida

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reels
          path: salida/*.mp4
          if-no-files-found: error
          retention-days: 14
