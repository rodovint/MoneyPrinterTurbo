name: Clips para el anuncio de SacaTus5

on:
  workflow_dispatch:
  push:
    branches: [sacatus5-clips]
    paths:
      - "scripts/sacatus5/**"
      - ".github/workflows/sacatus5-clips.yml"

permissions:
  contents: write

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Voces del capi (Sebastián) y más muestras
        run: |
          uv run python scripts/sacatus5/capi.py sacatus5/out es-VE-SebastianNeural sebastian
          uv run python scripts/sacatus5/muestras2.py sacatus5/out
      - name: Guardar en la rama
        run: |
          git config user.name "sacatus5-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sacatus5/out
          git commit -m "Voces de Sebastián y más muestras para SacaTus5" || echo "nada nuevo"
          git push origin HEAD:sacatus5-clips
