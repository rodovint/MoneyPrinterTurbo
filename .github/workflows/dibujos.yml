name: Dibujos (Cloudflare Workers AI)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lotes/dibujos/*.json", "scripts/guineo/dibujar.py"]

permissions:
  contents: write

concurrency:
  group: dibujos
  cancel-in-progress: false

jobs:
  dibujar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v5
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Revisar claves de Cloudflare
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Faltan los secretos CF_ACCOUNT_ID y CF_API_TOKEN en Settings > Secrets and variables > Actions"; exit 1; fi
      - name: Generar dibujos
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          mkdir -p out
          CAMBIADOS=$(git diff --name-only HEAD~1 HEAD -- lotes/dibujos/ | grep "\.json$" || true)
          [ -z "$CAMBIADOS" ] && CAMBIADOS=$(ls lotes/dibujos/*.json)
          for f in $CAMBIADOS; do
            n=$(basename "$f" .json)
            uv run python scripts/guineo/dibujar.py "$f" "out/$n" 2>&1 | tee -a out/log.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dibujos
          path: out/
      - name: Publicar dibujos en un Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(out/*/*.png out/log.txt)
          tag="dibujos-$(date -u +%Y%m%d-%H%M)-${{ github.run_number }}"
          mkdir -p plano
          for f in out/*/*.png; do cp "$f" "plano/$(basename $(dirname "$f"))-$(basename "$f")"; done
          cp out/log.txt plano/ 2>/dev/null || true
          gh release create "$tag" plano/* --title "Dibujos $tag" --notes "Generado por la ejecucion ${{ github.run_id }}" --target "${{ github.sha }}"
