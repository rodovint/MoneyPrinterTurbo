name: Cinecode assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cinecode/job.sh"]

permissions:
  contents: write

concurrency:
  group: cinecode
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Ejecutar tarea
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: bash cinecode/job.sh 2>&1 | tee cinecode-log.txt
      - name: Guardar resultados en la rama cinecode-out
        run: |
          mkdir -p /tmp/res && cp -r cinecode/out/. /tmp/res/ 2>/dev/null; cp cinecode-log.txt /tmp/res/
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan cinecode-out
          git rm -rfq . >/dev/null
          cp -r /tmp/res/. .
          git add -A
          git commit -qm "cinecode assets $(date -u +%FT%TZ)"
          git push -f origin cinecode-out
